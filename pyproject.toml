[project]
name = "is1proyect2026-grupo29"
version = "0.1.0"
description = "Collaborative question and answer platform with artificial intelligence integration"
readme = "README.md"
authors = [
    { name = "Gonzalo-FloresM", email = "floresgo42@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
is1proyect2026-grupo29 = "is1proyect2026_grupo29:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
